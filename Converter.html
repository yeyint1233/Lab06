<!DOCTYPE html>
<html>
<head>
    <title>Measurement Converter</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
            text-align:center;
            margin-top:40px;
        }

        .box{
            width:400px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input, select{
            width:90%;
            padding:10px;
            margin:10px;
        }

        button{
            padding:10px 20px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            margin:5px;
        }

        button:hover{
            background:#0056b3;
        }

        h2{
            color:#333;
        }

        #result{
            margin-top:20px;
            font-size:20px;
            color:green;
            font-weight:bold;
        }

    </style>
</head>

<body>

<div class="box">

<h2>Measurement Converter</h2>

<input type="number" id="value" placeholder="Enter value">

<select id="type">
    <option value="length">Length (Meter → Kilometer)</option>
    <option value="height">Height (Centimeter → Meter)</option>
    <option value="temperature">Temperature (Celsius → Fahrenheit)</option>
    <option value="area">Area (Square Meter → Square Kilometer)</option>
</select>

<br><br>

<button onclick="convert()">Convert</button>

<button onclick="goBack()">Back</button>

<p id="result"></p>

</div>

<script>

function convert()
{
    let value = parseFloat(document.getElementById("value").value);
    let type = document.getElementById("type").value;
    let answer = "";

    // Validation
    if(isNaN(value) || value < 0)
    {
        alert("Please enter a valid number.");
        document.getElementById("value").focus();
        return;
    }

    if(type=="length")
    {
        answer = value / 1000;
        document.getElementById("result").innerHTML =
        value + " meter = " + answer + " kilometer";
    }

    else if(type=="height")
    {
        answer = value / 100;
        document.getElementById("result").innerHTML =
        value + " cm = " + answer + " meter";
    }

    else if(type=="temperature")
    {
        answer = (value * 9/5) + 32;
        document.getElementById("result").innerHTML =
        value + " °C = " + answer.toFixed(2) + " °F";
    }

    else if(type=="area")
    {
        answer = value / 1000000;
        document.getElementById("result").innerHTML =
        value + " m² = " + answer + " km²";
    }
}

function goBack()
{
    history.back();
}

</script>

</body>
</html>
